<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>MusimLab — Seasons</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, Helvetica, sans-serif;
    background: #f5f7f9;
    color: #1f2937;
}

.container {
    max-width: 900px;
    margin: auto;
    padding: 20px 16px 50px;
}

/* HEADER */

.header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 24px;
}

.logo {
    font-size: 22px;
    font-weight: 700;
    letter-spacing: .5px;
}

.back-btn {
    border: none;
    background: transparent;
    color: #555;
    font-size: 14px;
    cursor: pointer;
}

/* PAGE TITLE */

.page-title {
    margin-bottom: 20px;
}

.page-title h1 {
    margin: 0 0 6px;
    font-size: 28px;
}

.page-title p {
    margin: 0;
    color: #6b7280;
    font-size: 14px;
}

/* TOP BAR */

.top-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
    margin-bottom: 18px;
}

.count {
    font-size: 14px;
    color: #6b7280;
}

.primary-btn {
    border: none;
    background: #111827;
    color: white;
    padding: 11px 16px;
    border-radius: 10px;
    font-size: 14px;
    cursor: pointer;
}

.primary-btn:hover {
    opacity: .9;
}

/* SEASON CARD */

.season-list {
    display: grid;
    gap: 12px;
}

.season-card {
    background: white;
    border: 1px solid #e5e7eb;
    border-radius: 14px;
    padding: 16px;
}

.season-main {
    display: flex;
    align-items: flex-start;
    gap: 12px;
}

.home-check {
    margin-top: 4px;
    width: 18px;
    height: 18px;
    cursor: pointer;
}

.season-info {
    flex: 1;
    min-width: 0;
}

.season-name {
    font-size: 17px;
    font-weight: 700;
    margin-bottom: 5px;
}

.season-description {
    font-size: 14px;
    color: #6b7280;
    line-height: 1.5;
}

.home-label {
    display: inline-block;
    margin-top: 9px;
    font-size: 12px;
    color: #2563eb;
    font-weight: 600;
}

.card-actions {
    display: flex;
    gap: 8px;
    margin-top: 14px;
    padding-top: 12px;
    border-top: 1px solid #f0f0f0;
}

.small-btn {
    border: 1px solid #d1d5db;
    background: white;
    padding: 8px 12px;
    border-radius: 8px;
    font-size: 13px;
    cursor: pointer;
}

.small-btn.delete {
    color: #b91c1c;
}

.small-btn:hover {
    background: #f9fafb;
}

/* EMPTY */

.empty {
    background: white;
    border: 1px dashed #d1d5db;
    border-radius: 14px;
    padding: 40px 20px;
    text-align: center;
    color: #6b7280;
}

/* MODAL */

.modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,.45);
    display: none;
    align-items: center;
    justify-content: center;
    padding: 16px;
    z-index: 1000;
}

.modal-overlay.show {
    display: flex;
}

.modal {
    width: 100%;
    max-width: 500px;
    background: white;
    border-radius: 16px;
    padding: 20px;
    max-height: 90vh;
    overflow-y: auto;
}

.modal h2 {
    margin: 0 0 18px;
    font-size: 21px;
}

.form-group {
    margin-bottom: 16px;
}

.form-group label {
    display: block;
    margin-bottom: 7px;
    font-size: 13px;
    font-weight: 600;
}

.form-group input,
.form-group textarea {
    width: 100%;
    border: 1px solid #d1d5db;
    border-radius: 9px;
    padding: 11px 12px;
    font-size: 14px;
    font-family: inherit;
    outline: none;
}

.form-group input:focus,
.form-group textarea:focus {
    border-color: #6b7280;
}

.form-group textarea {
    min-height: 110px;
    resize: vertical;
}

.checkbox-row {
    display: flex;
    align-items: center;
    gap: 9px;
    padding: 12px;
    background: #f9fafb;
    border-radius: 10px;
}

.checkbox-row input {
    width: 18px;
    height: 18px;
    cursor: pointer;
}

.checkbox-row label {
    margin: 0;
    cursor: pointer;
    font-size: 14px;
}

.modal-actions {
    display: flex;
    justify-content: flex-end;
    gap: 8px;
    margin-top: 20px;
}

.cancel-btn {
    border: 1px solid #d1d5db;
    background: white;
    color: #374151;
    padding: 10px 15px;
    border-radius: 9px;
    cursor: pointer;
}

/* MESSAGE */

.message {
    position: fixed;
    left: 50%;
    bottom: 20px;
    transform: translateX(-50%);
    background: #111827;
    color: white;
    padding: 11px 16px;
    border-radius: 10px;
    font-size: 13px;
    display: none;
    z-index: 2000;
    max-width: calc(100% - 32px);
    text-align: center;
}

.message.show {
    display: block;
}

/* MOBILE */

@media (max-width: 600px) {

    .container {
        padding: 16px 12px 40px;
    }

    .page-title h1 {
        font-size: 24px;
    }

    .top-bar {
        align-items: stretch;
        flex-direction: column;
    }

    .primary-btn {
        width: 100%;
    }

    .season-card {
        padding: 14px;
    }

    .card-actions {
        display: grid;
        grid-template-columns: 1fr 1fr;
    }

    .small-btn {
        width: 100%;
    }
}
</style>
</head>

<body>

<div class="container">

    <header class="header">
        <div class="logo">MUSIMLAB</div>

        <button class="back-btn" onclick="goBack()">
            ← Admin
        </button>
    </header>

    <section class="page-title">
        <h1>🌦️ Seasons</h1>
        <p>Urus semua musim dan pilih sehingga 4 musim untuk dipaparkan di Home.</p>
    </section>

    <div class="top-bar">
        <div class="count" id="homeCount">
            0 / 4 dipaparkan di Home
        </div>

        <button class="primary-btn" onclick="openAddSeason()">
            + Add Season
        </button>
    </div>

    <div id="seasonList" class="season-list">
        <div class="empty">
            Loading seasons...
        </div>
    </div>

</div>


<!-- ADD / EDIT SEASON MODAL -->

<div id="seasonModal" class="modal-overlay">

    <div class="modal">

        <h2 id="modalTitle">Add Season</h2>

        <div class="form-group">
            <label for="seasonName">
                Season Name
            </label>

            <input
                type="text"
                id="seasonName"
                placeholder="Contoh: Musim Hujan"
            >
        </div>

        <div class="form-group">
            <label for="seasonDescription">
                Description
            </label>

            <textarea
                id="seasonDescription"
                placeholder="Penerangan ringkas tentang musim ini..."
            ></textarea>
        </div>

        <div class="checkbox-row">

            <input
                type="checkbox"
                id="showOnHome"
            >

            <label for="showOnHome">
                Display this season on Home
            </label>

        </div>

        <div class="modal-actions">

            <button
                class="cancel-btn"
                onclick="closeSeasonModal()"
            >
                Cancel
            </button>

            <button
                class="primary-btn"
                onclick="saveSeason()"
            >
                Save Season
            </button>

        </div>

    </div>

</div>


<div id="message" class="message"></div>


<script>

const API_URL =
"https://script.google.com/macros/s/AKfycbxEGV5ZfShKK0gsALDr48ENe4uzYuY4Qqdv0ob64EFwF5QZ2PUNqDHUQCJIWrOwwzCp/exec";

let seasons = [];
let editingSeasonId = null;


/* =========================
   LOAD SEASONS
========================= */
async function loadSeasons() {

    const list = document.getElementById("seasonList");

    list.innerHTML = `
        <div class="empty">
            Loading seasons...
        </div>
    `;

    try {

        const response = await fetch(API_URL + "?action=getSeasons");
        const result = await response.json();

        if (result.success) {
            seasons = result.data || [];
        } else {
            seasons = [];
            showMessage(result.message || "Gagal load Seasons.");
        }

        renderSeasons();

    } catch (error) {
        console.error(error);
        list.innerHTML = `
            <div class="empty">
                Gagal load Seasons.
            </div>
        `;
        showMessage("Gagal load Seasons.");
    }
}


/* =========================
   RENDER
========================= */

function renderSeasons() {

    const list =
        document.getElementById("seasonList");

    const selectedCount =
        seasons.filter(
            s => isTrue(s["Show on Home"])
        ).length;

    document.getElementById("homeCount").textContent =
        selectedCount + " / 4 dipaparkan di Home";

    if (!seasons.length) {

        list.innerHTML = `
            <div class="empty">
                Belum ada Season.<br><br>
                Klik <strong>+ Add Season</strong> untuk mula.
            </div>
        `;

        return;
    }

    list.innerHTML =
        seasons.map(season => {

            const id =
                season["Season ID"] || "";

            const name =
                season["Season Name"] || "Untitled Season";

            const description =
                season["Description"] || "";

            const checked =
                isTrue(season["Show on Home"]);

            return `
                <div class="season-card">

                    <div class="season-main">

                        <input
                            class="home-check"
                            type="checkbox"
                            ${checked ? "checked" : ""}
                            onchange="toggleHomeDisplay('${escapeJs(id)}')"
                            title="Display on Home"
                        >

                        <div class="season-info">

                            <div class="season-name">
                                ${escapeHtml(name)}
                            </div>

                            <div class="season-description">
                                ${escapeHtml(description)}
                            </div>

                            ${
                                checked
                                ? `
                                    <div class="home-label">
                                        ✓ Display on Home
                                    </div>
                                  `
                                : ""
                            }

                        </div>

                    </div>

                    <div class="card-actions">

                        <button
                            class="small-btn"
                            onclick="openEditSeason('${escapeJs(id)}')"
                        >
                            Edit
                        </button>

                        <button
                            class="small-btn delete"
                            onclick="deleteSeason('${escapeJs(id)}')"
                        >
                            Delete
                        </button>

                    </div>

                </div>
            `;

        }).join("");
}


/* =========================
   ADD
========================= */

function openAddSeason() {

    editingSeasonId = null;

    document.getElementById("modalTitle").textContent =
        "Add Season";

    document.getElementById("seasonName").value =
        "";

    document.getElementById("seasonDescription").value =
        "";

    document.getElementById("showOnHome").checked =
        false;

    document
        .getElementById("seasonModal")
        .classList
        .add("show");
}


/* =========================
   EDIT
========================= */

function openEditSeason(id) {

    const season =
        seasons.find(
            s => String(s["Season ID"]) === String(id)
        );

    if (!season) {

        showMessage("Season tidak dijumpai.");

        return;
    }

    editingSeasonId = id;

    document.getElementById("modalTitle").textContent =
        "Edit Season";

    document.getElementById("seasonName").value =
        season["Season Name"] || "";

    document.getElementById("seasonDescription").value =
        season["Description"] || "";

    document.getElementById("showOnHome").checked =
        isTrue(season["Show on Home"]);

    document
        .getElementById("seasonModal")
        .classList
        .add("show");
}


/* =========================
   CLOSE MODAL
========================= */

function closeSeasonModal() {

    document
        .getElementById("seasonModal")
        .classList
        .remove("show");

    editingSeasonId = null;
}


/* =========================
   SAVE SEASON
========================= */

async function saveSeason() {

    const name =
        document
            .getElementById("seasonName")
            .value
            .trim();

    const description =
        document
            .getElementById("seasonDescription")
            .value
            .trim();

    const showOnHome =
        document
            .getElementById("showOnHome")
            .checked;

    if (!name) {

        showMessage("Sila masukkan Season Name.");

        return;
    }


    /*
       Check maximum 4
    */

    const existingSelectedCount =
        seasons.filter(s =>
            isTrue(s["Show on Home"]) &&
            String(s["Season ID"]) !==
            String(editingSeasonId || "")
        ).length;

    if (
        showOnHome &&
        existingSelectedCount >= 4
    ) {

        showMessage(
            "Maksimum 4 Season sahaja boleh dipaparkan di Home."
        );

        return;
    }


    const action =
        editingSeasonId
        ? "updateSeason"
        : "addSeason";


    const data =
        editingSeasonId
        ? {
            seasonId: editingSeasonId,
            seasonName: name,
            description: description,
            showOnHome: showOnHome
        }
        : {
            seasonName: name,
            description: description,
            showOnHome: showOnHome
        };


    try {

        showMessage("Saving...");

        const response =
            await fetch(API_URL, {
                method: "POST",
                body: JSON.stringify({
                    action: action,
                    data: data
                })
            });

        const result =
            await response.json();

        if (!result.success) {

            showMessage(
                result.message ||
                "Gagal save Season."
            );

            return;
        }

        closeSeasonModal();

        showMessage(
            editingSeasonId
            ? "Season berjaya dikemaskini."
            : "Season berjaya ditambah."
        );

        await loadSeasons();

    } catch (error) {

        console.error(error);

        showMessage(
            "Ralat semasa save Season."
        );

    }
}


/* =========================
   TOGGLE HOME
========================= */

async function toggleHomeDisplay(id) {

    const season =
        seasons.find(
            s => String(s["Season ID"]) === String(id)
        );

    if (!season) return;

    const current =
        isTrue(season["Show on Home"]);

    const newValue =
        !current;


    /*
       If turning ON,
       check maximum 4.
    */

    if (newValue) {

        const selectedCount =
            seasons.filter(
                s => isTrue(s["Show on Home"])
            ).length;

        if (selectedCount >= 4) {

            showMessage(
                "Maksimum 4 Season sahaja boleh dipaparkan di Home."
            );

            renderSeasons();

            return;
        }
    }


    try {

        showMessage("Updating...");

        const response =
            await fetch(API_URL, {
                method: "POST",
                body: JSON.stringify({
                    action: "updateSeason",
                    data: {
                        seasonId: id,
                        seasonName:
                            season["Season Name"] || "",
                        description:
                            season["Description"] || "",
                        showOnHome:
                            newValue
                    }
                })
            });

        const result =
            await response.json();

        if (!result.success) {

            showMessage(
                result.message ||
                "Gagal update Season."
            );

            renderSeasons();

            return;
        }

        await loadSeasons();

        showMessage(
            newValue
            ? "Season dipaparkan di Home."
            : "Season dikeluarkan dari Home."
        );

    } catch (error) {

        console.error(error);

        showMessage(
            "Ralat semasa update Season."
        );

        renderSeasons();

    }
}


/* =========================
   DELETE
========================= */

async function deleteSeason(id) {

    const season =
        seasons.find(
            s => String(s["Season ID"]) === String(id)
        );

    if (!season) {

        showMessage("Season tidak dijumpai.");

        return;
    }

    const name =
        season["Season Name"] || "Season ini";


    const confirmDelete =
        confirm(
            `Delete "${name}"?\n\nSeason ini akan dipadam dari database.`
        );

    if (!confirmDelete) return;


    try {

        showMessage("Deleting...");

        const response =
            await fetch(API_URL, {
                method: "POST",
                body: JSON.stringify({
                    action: "deleteSeason",
                    data: {
                        seasonId: id
                    }
                })
            });

        const result =
            await response.json();

        if (!result.success) {

            showMessage(
                result.message ||
                "Gagal delete Season."
            );

            return;
        }

        showMessage(
            "Season berjaya dipadam."
        );

        await loadSeasons();

    } catch (error) {

        console.error(error);

        showMessage(
            "Ralat semasa delete Season."
        );

    }
}


/* =========================
   HELPERS
========================= */

function isTrue(value) {

    if (value === true) return true;

    const text =
        String(value || "")
            .trim()
            .toLowerCase();

    return (
        text === "true" ||
        text === "yes" ||
        text === "1"
    );
}


function escapeHtml(value) {

    return String(value || "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}


function escapeJs(value) {

    return String(value || "")
        .replace(/\\/g, "\\\\")
        .replace(/'/g, "\\'");
}


function showMessage(text) {

    const message =
        document.getElementById("message");

    message.textContent = text;

    message.classList.add("show");

    clearTimeout(window.messageTimer);

    window.messageTimer =
        setTimeout(() => {

            message.classList.remove("show");

        }, 2500);
}


function goBack() {

    window.location.href = "admin.html";

}


/* =========================
   CLOSE MODAL ON BACKDROP
========================= */

document
    .getElementById("seasonModal")
    .addEventListener("click", function(event) {

        if (event.target === this) {

            closeSeasonModal();

        }

    });


/* =========================
   INITIAL LOAD
========================= */

loadSeasons();

</script>

</body>
</html>
