<html lang="ms">

<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{margin:0;padding:0;background:#f7f7f8;color:#171717;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;overflow-x:hidden}
body.no-scroll{overflow:hidden}
button{font:inherit}
img{max-width:100%;display:block}

main{max-width:760px;margin:0 auto;padding:0 0 100px}

/* HEADER */
.top-header{background:#fff;padding:12px 16px;border-bottom:1px solid #eee;position:sticky;top:0;z-index:50;display:flex;align-items:center;gap:12px}
.back-btn{background:#f1f1f3;border:0;padding:8px 12px;border-radius:10px;font-size:13px;font-weight:700;color:#171717;cursor:pointer;display:flex;align-items:center;gap:6px;flex-shrink:0;text-decoration:none}
.back-btn:active{transform:scale(.95)}
.header-brand{font-size:14px;font-weight:800;letter-spacing:-.3px}
.header-brand span{font-weight:400;color:#9ca3af}

/* LOADING */
.loading-wrap{text-align:center;padding:80px 20px}
.loading-spinner{width:36px;height:36px;border:3px solid #e5e7eb;border-top-color:#8b5cf6;border-radius:50%;animation:spin .7s linear infinite;margin:0 auto 16px}
@keyframes spin{to{transform:rotate(360deg)}}
.loading-text{font-size:13px;color:#888;font-weight:600}

/* ERROR */
.error-wrap{text-align:center;padding:60px 20px}
.error-emoji{font-size:52px;margin-bottom:14px;opacity:.6}
.error-msg{font-size:16px;font-weight:700;color:#333;margin-bottom:6px}
.error-sub{font-size:13px;color:#888;margin-bottom:20px}
.error-link{display:inline-block;background:#171717;color:#fff;padding:12px 20px;border-radius:12px;text-decoration:none;font-size:13px;font-weight:700}

/* CAROUSEL */
.carousel-wrap{position:relative;background:#f5f5f7}
.carousel-track{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.carousel-track::-webkit-scrollbar{display:none}
.carousel-slide{flex:0 0 100%;scroll-snap-align:start;position:relative;aspect-ratio:16/10;background:#f0f0f3;overflow:hidden}
.carousel-slide img{width:100%;height:100%;object-fit:cover;cursor:zoom-in}
.carousel-fallback{width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-size:64px;background:linear-gradient(135deg,#ede9fe,#ddd6fe)}
.carousel-dots{display:flex;justify-content:center;gap:6px;padding:10px 0;background:#f5f5f7}
.carousel-dot{width:6px;height:6px;border-radius:50%;background:#d4d4d8;transition:.2s}
.carousel-dot.active{background:#171717;width:20px;border-radius:999px}

/* CONTENT */
.content{padding:20px 16px 0}
.cat-pill{display:inline-flex;align-items:center;gap:7px;padding:5px 11px;border-radius:999px;font-size:11px;font-weight:800;margin-bottom:14px}
.cat-pill .cat-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.date-range-block{margin-bottom:16px}
.date-range-main{font-size:28px;font-weight:900;letter-spacing:-.5px;line-height:1.15}
.date-range-sub{font-size:13px;color:#888;font-weight:600;margin-top:6px}
.detail-title{font-size:26px;font-weight:800;line-height:1.2;letter-spacing:-.5px;margin:0 0 10px}
.detail-meta{font-size:13px;color:#666;line-height:1.6;margin-bottom:16px}
.detail-synopsis{font-size:15px;line-height:1.75;color:#333;margin-bottom:20px;white-space:pre-line}

/* ACTIONS */
.detail-actions{display:flex;gap:8px;margin-bottom:20px;flex-wrap:wrap}
.action-btn{flex:1;min-width:calc(50% - 4px);padding:13px 14px;border-radius:12px;font-size:13px;font-weight:700;border:0;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px;transition:.15s;text-decoration:none;font-family:inherit}
.action-btn:active{transform:scale(.96)}
.action-btn.primary{background:#171717;color:#fff}
.action-btn.secondary{background:#f1f1f3;color:#171717}
.action-btn.success{background:#dcfce7;color:#166534}
.action-btn.share{background:#8b5cf6;color:#fff}
.action-btn.full{min-width:100%}

/* AFFILIATE */
.affiliate-section{margin-top:12px;padding-top:24px;border-top:1px solid #f0f0f0}
.affiliate-title{font-size:15px;font-weight:800;margin-bottom:14px;display:flex;align-items:center;gap:6px}
.affiliate-card{background:#fafafa;border:1px solid #ededed;border-radius:14px;padding:14px;margin-bottom:9px}
.affiliate-name{font-size:14px;font-weight:800;margin-bottom:6px}
.affiliate-desc{font-size:12px;color:#555;line-height:1.6;white-space:pre-line;margin-bottom:12px}
.affiliate-buy{display:inline-flex;align-items:center;gap:6px;background:#8b5cf6;color:#fff;text-decoration:none;padding:10px 16px;border-radius:9px;font-size:12px;font-weight:800}
.affiliate-buy:active{transform:scale(.96)}

/* SEASON HERO */
.season-hero{height:160px;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden}
.season-hero::before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 80% 20%,rgba(255,255,255,.4),transparent 60%)}
.season-icon-big{font-size:80px;line-height:1;position:relative;z-index:2;filter:drop-shadow(0 6px 16px rgba(0,0,0,.1))}

/* NEWS */
.news-severity-badge{display:inline-flex;align-items:center;gap:7px;padding:6px 12px;border-radius:999px;font-size:12px;font-weight:800;margin-bottom:14px}
.news-meta-line{font-size:12px;color:#888;margin-bottom:18px;font-weight:600}
.news-credit{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:#666;background:#f5f5f7;padding:10px 14px;border-radius:10px;text-decoration:none;font-weight:600;margin-bottom:16px;margin-top:8px}

/* FOOTER CTA */
.footer-cta{margin-top:30px;padding:24px 16px;text-align:center;border-top:1px solid #f0f0f0}
.footer-cta-title{font-size:14px;font-weight:700;margin-bottom:8px}
.footer-cta-sub{font-size:12px;color:#888;margin-bottom:16px}
.footer-cta-btn{display:inline-block;background:#8b5cf6;color:#fff;padding:12px 24px;border-radius:12px;text-decoration:none;font-size:13px;font-weight:800}

/* LIGHTBOX */
.lightbox{position:fixed;inset:0;background:rgba(0,0,0,.96);z-index:300;display:none;align-items:center;justify-content:center;padding:0;touch-action:none}
.lightbox.open{display:flex}
.lightbox img{max-width:100%;max-height:100vh;object-fit:contain;user-select:none;-webkit-user-drag:none;transition:transform .2s}
.lightbox-close{position:absolute;top:calc(16px + env(safe-area-inset-top));right:16px;width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.15);color:#fff;border:0;font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;backdrop-filter:blur(10px);z-index:2}
.lightbox-counter{position:absolute;top:calc(22px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);color:#fff;font-size:13px;font-weight:700;background:rgba(255,255,255,.15);padding:6px 14px;border-radius:999px;backdrop-filter:blur(10px);z-index:2}

/* TOAST */
.toast{position:fixed;left:50%;bottom:calc(30px + env(safe-area-inset-bottom));transform:translate(-50%,20px);background:#171717;color:#fff;padding:12px 18px;border-radius:12px;font-size:13px;font-weight:600;opacity:0;pointer-events:none;transition:all .25s;z-index:400;max-width:calc(100vw - 32px);text-align:center;box-shadow:0 10px 30px rgba(0,0,0,.2)}
.toast.show{opacity:1;transform:translate(-50%,0)}

@media (min-width:700px){
  .carousel-slide{aspect-ratio:16/9}
  .detail-title{font-size:30px}
}
</style>
</head>

</main>

<!-- LIGHTBOX -->
<div class="lightbox" id="lightbox">

  <button class="lightbox-close" onclick="closeLightbox()">✕</button>

</div>

<div class="toast" id="toast"></div>

<script>
/* =====================================================
   MUSIM LAB — SINGLE PAGE (Event / Season / News)
===================================================== */

const API_URL = "https://script.google.com/macros/s/AKfycbz_Aqg5XEskKKpwsoz9WA4HcSCV5H61cK63hj9kw78YD_eRCCQgkm71q_KJhoG2SfX4/exec";
const API_TOKEN = "ml-2025-a7b3c9d1e5f6";

let allItems = [];
let savedIds = JSON.parse(localStorage.getItem("ml_saved") || "[]");
let currentItem = null;
let currentType = null;

const monthNames = ["Januari","Februari","Mac","April","Mei","Jun","Julai","Ogos","September","Oktober","November","Disember"];
const monthShort = ["JAN","FEB","MAC","APR","MEI","JUN","JUL","OGO","SEP","OKT","NOV","DIS"];
const dayNames = ["Ahad","Isnin","Selasa","Rabu","Khamis","Jumaat","Sabtu"];

const CATEGORIES = [
  { name: "Muzik & Konsert", icon: "🎵", color: "#8b5cf6" },
  { name: "Sukan & Outdoor", icon: "⚽", color: "#f59e0b" },
  { name: "Budaya & Agama", icon: "🕌", color: "#10b981" },
  { name: "Teknologi & Perniagaan", icon: "💼", color: "#3b82f6" },
  { name: "Gaya Hidup", icon: "✨", color: "#f43f5e" },
  { name: "Local", icon: "🏘️", color: "#a16207" },
  { name: "Cuti Sekolah", icon: "🎒", color: "#06b6d4" },
  { name: "Musim", icon: "🌦️", color: "#6366f1" }
];

const SEVERITY_MAP = {
  "Info": { icon: "ℹ️", color: "#3b82f6" },
  "Warning": { icon: "⚠️", color: "#f59e0b" },
  "Danger": { icon: "🚨", color: "#ef4444" }
};

/* ============ HELPERS ============ */
function normalise(v){return String(v||"").trim().toLowerCase()}
function $(id){return document.getElementById(id)}
function getCatInfo(cat){
  const c = CATEGORIES.find(x => normalise(x.name) === normalise(cat));
  return c || { name: cat || "Lain-lain", icon: "📍", color: "#8b5e3c" };
}
function getSevInfo(s){return SEVERITY_MAP[s] || SEVERITY_MAP["Info"];}

function parseDate(value){
  if(!value) return null;
  if(value instanceof Date) return new Date(value.getFullYear(),value.getMonth(),value.getDate());
  const text = String(value).trim();
  if(!text) return null;

  if(text.includes("T")){
    const d = new Date(text);
    if(!isNaN(d.getTime())){
      const my = new Date(d.getTime() + 8 * 3600 * 1000);
      return new Date(my.getUTCFullYear(), my.getUTCMonth(), my.getUTCDate());
    }
  }

  let m = text.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);
  if(m) return new Date(+m[1],+m[2]-1,+m[3]);
  m = text.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})/);
  if(m) return new Date(+m[3],+m[2]-1,+m[1]);
  const d = new Date(text);
  if(!isNaN(d.getTime())) return new Date(d.getFullYear(), d.getMonth(), d.getDate());
  return null;
}

function sameDate(a,b){return a&&b&&a.getFullYear()===b.getFullYear()&&a.getMonth()===b.getMonth()&&a.getDate()===b.getDate()}
function formatDate(d){if(!d) return "";return `${d.getDate()} ${monthNames[d.getMonth()]} ${d.getFullYear()}`;}

function driveToDirect(url){
  if(!url) return "";
  url = String(url).trim();
  if(url.includes("lh3.googleusercontent.com")) return url;
  if(url.includes("drive.google.com/thumbnail")) return url;
  let id = null, m;
  if((m = url.match(/\/file\/d\/([^\/\?]+)/))) id = m[1];
  else if((m = url.match(/[?&]id=([^&]+)/))) id = m[1];
  else if((m = url.match(/\/d\/([^\/\?]+)/))) id = m[1];
  if(id) return `https://lh3.googleusercontent.com/d/${id}=w1200`;
  return url;
}

function parseImages(raw){
  if(!raw) return [];
  return String(raw).split(/[\n|]/).map(s => s.trim()).filter(Boolean).map(driveToDirect);
}

function formatTimeAgo(date){
  const diff = Date.now() - date.getTime();
  const mins = Math.floor(diff / 60000);
  if(mins < 1) return "Baru sahaja";
  if(mins < 60) return mins + " minit lepas";
  const hours = Math.floor(mins / 60);
  if(hours < 24) return hours + " jam lepas";
  const days = Math.floor(hours / 24);
  if(days < 7) return days + " hari lepas";
  return formatDate(date);
}

function buildDateRange(start, end){
  let dateMain = "", dateSub = "";
  if(!start) return { dateMain: "—", dateSub: "" };
  const sD = start.getDate(), sM = monthShort[start.getMonth()], sY = start.getFullYear();
  if(end && !sameDate(start, end)){
    const eD = end.getDate(), eM = monthShort[end.getMonth()], eY = end.getFullYear();
    if(sM === eM && sY === eY){
      dateMain = `${sD} – ${eD} ${sM} ${sY}`;
    } else if(sY === eY){
      dateMain = `${sD} ${sM} – ${eD} ${eM} ${sY}`;
    } else {
      dateMain = `${sD} ${sM} ${sY} – ${eD} ${eM} ${eY}`;
    }
    dateSub = `${dayNames[start.getDay()]} – ${dayNames[end.getDay()]}`;
  } else {
    dateMain = `${sD} ${sM} ${sY}`;
    dateSub = dayNames[start.getDay()];
  }
  return { dateMain, dateSub };
}

function hexWithAlpha(hex, alpha){
  const h = String(hex).replace("#","");
  const r = parseInt(h.substring(0,2),16), g = parseInt(h.substring(2,4),16), b = parseInt(h.substring(4,6),16);
  return `rgba(${r},${g},${b},${alpha})`;
}

function showToast(msg){
  const t = $("toast");
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(showToast._timer);
  showToast._timer = setTimeout(()=>t.classList.remove("show"), 2400);
}

function escapeHtml(v){
  return String(v||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#039;");
}

/* ============ API ============ */
async function fetchAPI(params){
  const query = new URLSearchParams({ ...params, token: API_TOKEN, t: Date.now() });
  const r = await fetch(API_URL + "?" + query.toString());
  return r.json();
}

/* ============ CAROUSEL ============ */
function buildCarousel(images, icon){
  if(!images.length){
    return `<div class="carousel-wrap"><div class="carousel-slide"><div class="carousel-fallback">${icon}</div></div></div>`;
  }
  const slides = images.map((src, i) => `
    <div class="carousel-slide">
      <img src="${escapeHtml(src)}" alt="" loading="${i===0?"eager":"lazy"}"
           onclick="openLightbox(${JSON.stringify(images).replace(/"/g,'&quot;')}, ${i})"
           onerror="this.style.display='none';this.parentElement.innerHTML='<div class=\\'carousel-fallback\\'>${icon}</div>'">
    </div>
  `).join("");
  const dots = images.length > 1
    ? `<div class="carousel-dots">${images.map((_,i)=>`<div class="carousel-dot ${i===0?"active":""}"></div>`).join("")}</div>`
    : "";
  return `<div class="carousel-wrap" id="carouselWrap"><div class="carousel-track" id="carouselTrack">${slides}</div>${dots}</div>`;
}

function attachCarouselScroll(){
  const track = $("carouselTrack");
  if(!track) return;
  const dots = document.querySelectorAll(".carousel-dot");
  if(!dots.length) return;
  track.addEventListener("scroll", () => {
    const idx = Math.round(track.scrollLeft / track.clientWidth);
    dots.forEach((d,i) => d.classList.toggle("active", i === idx));
  }, {passive:true});
}

/* ============ PREPARATION ============ */
async function loadPreparation(type, id, containerId){
  const container = $(containerId);
  if(!container) return;

  let action = "getEventItems", param = "eventId";
  if(type === "season"){ action = "getSeasonItems"; param = "seasonId"; }
  else if(type === "news"){ action = "getNewsItems"; param = "newsId"; }

  try{
    const params = { action };
    params[param] = id;
    const res = await fetchAPI(params);
    const mappings = (res && res.success && Array.isArray(res.data)) ? res.data : [];
    if(!mappings.length) return;

    const itemIds = mappings.map(m => m["Item ID"]).filter(Boolean);
    const selectedItems = itemIds.map(iid => allItems.find(it => String(it["Item ID"]) === String(iid))).filter(Boolean);
    if(!selectedItems.length) return;

    container.innerHTML = `
      <div class="affiliate-section">
        <div class="affiliate-title">🛍️ Persediaan & Beli</div>
        ${selectedItems.map(it => {
          const icon = it["Icon"] || "🛍️";
          const name = it["Name"] || "";
          const desc = it["Description"] || "";
          const url = it["URL"] || "";
          return `
            <div class="affiliate-card">
              <div class="affiliate-name">${escapeHtml(icon)} ${escapeHtml(name)}</div>
              ${desc ? `<div class="affiliate-desc">${escapeHtml(desc)}</div>` : ""}
              ${url ? `<a href="${escapeHtml(url)}" target="_blank" rel="noopener" class="affiliate-buy">🛒 Beli Sekarang →</a>` : ""}
            </div>
          `;
        }).join("")}
      </div>
    `;
  }catch(e){console.error("prep err", e)}
}

/* ============ SAVE ============ */
function toggleSave(id, btn){
  const idx = savedIds.indexOf(id);
  if(idx >= 0){savedIds.splice(idx,1);showToast("Dibuang dari simpanan");}
  else{savedIds.push(id);showToast("❤ Disimpan!");}
  localStorage.setItem("ml_saved", JSON.stringify(savedIds));
  if(btn){
    const isSaved = savedIds.includes(id);
    btn.classList.toggle("success", isSaved);
    btn.classList.toggle("secondary", !isSaved);
    btn.innerHTML = isSaved ? "✓ Disimpan" : "❤ Simpan";
  }
}

/* ============ SHARE ============ */
async function shareItem(){
  if(!currentItem) return;
  let title, text, url;

  if(currentType === "event"){
    const start = parseDate(currentItem["Start Date"]);
    const locLine = [currentItem["Location"], currentItem["Negeri"]].filter(Boolean).join(", ");
    title = currentItem["Event Name"] || "";
    text = `${title} — ${formatDate(start)}${locLine ? " • " + locLine : ""}`;
    url = window.location.href;
  } else if(currentType === "season"){
    title = currentItem["Season Name"] || "";
    text = `${title} — Musim aktif di Malaysia`;
    url = window.location.href;
  } else {
    title = currentItem["Title"] || "";
    text = `${title}`;
    url = window.location.href;
  }

  if(navigator.share){
    try{ await navigator.share({ title, text, url }); }
    catch(err){ if(err.name !== "AbortError") console.error(err); }
  } else {
    try{
      await navigator.clipboard.writeText(`${text}\n${url}`);
      showToast("📋 Link disalin!");
    }catch(err){
      showToast("Tak dapat copy link");
    }
  }
}

/* ============ ICS (Event only) ============ */
function downloadICS(){
  if(currentType !== "event" || !currentItem) return;
  const start = parseDate(currentItem["Start Date"]);
  const end = parseDate(currentItem["End Date"]) || start;
  if(!start){showToast("Tarikh tak dijumpai");return;}

  function fmt(d){return d.getFullYear()+String(d.getMonth()+1).padStart(2,"0")+String(d.getDate()).padStart(2,"0");}
  const title = currentItem["Event Name"] || "Event";
  const desc = (currentItem["Short Description"] || currentItem["Description"] || "").replace(/\n/g,"\\n");
  const loc = [currentItem["Location"], currentItem["Negeri"]].filter(Boolean).join(", ");
  const id = currentItem["Event ID"];

  const ics = [
    "BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//Musim Lab//EN","BEGIN:VEVENT",
    `UID:${id}@musimlab`,`DTSTAMP:${fmt(new Date())}T000000Z`,
    `DTSTART;VALUE=DATE:${fmt(start)}`,
    `DTEND;VALUE=DATE:${fmt(new Date(end.getTime()+86400000))}`,
    `SUMMARY:${title}`, desc ? `DESCRIPTION:${desc}` : "", loc ? `LOCATION:${loc}` : "",
    "BEGIN:VALARM","TRIGGER:-P1D","ACTION:DISPLAY","DESCRIPTION:Esok: " + title,"END:VALARM",
    "END:VEVENT","END:VCALENDAR"
  ].filter(Boolean).join("\r\n");

  const blob = new Blob([ics], {type:"text/calendar"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = title.replace(/[^a-z0-9]/gi,"_") + ".ics";
  a.click();
  URL.revokeObjectURL(url);
  showToast("🔔 Fail kalendar dimuat turun");
}

/* ============ LIGHTBOX ============ */
let lbImages = [];
let lbIndex = 0;
let lbSX = 0, lbSY = 0, lbCX = 0, lbCY = 0, lbActive = false;

function openLightbox(images, startIndex = 0){
  lbImages = images;
  lbIndex = startIndex;
  updateLightbox();
  $("lightbox").classList.add("open");
  document.body.classList.add("no-scroll");
}
function updateLightbox(){
  $("lightboxImg").src = lbImages[lbIndex] || "";
  $("lightboxCounter").textContent = `${lbIndex + 1} / ${lbImages.length}`;
}
function closeLightbox(){
  $("lightbox").classList.remove("open");
  $("lightboxImg").src = "";
  document.body.classList.remove("no-scroll");
}

(function(){
  const lb = $("lightbox");
  lb.addEventListener("touchstart", e => {
    lbSX = e.touches[0].clientX; lbSY = e.touches[0].clientY;
    lbCX = 0; lbCY = 0; lbActive = true;
  }, {passive:true});
  lb.addEventListener("touchmove", e => {
    if(!lbActive) return;
    lbCX = e.touches[0].clientX - lbSX;
    lbCY = e.touches[0].clientY - lbSY;
    const img = $("lightboxImg");
    if(Math.abs(lbCX) > Math.abs(lbCY)){
      img.style.transform = `translateX(${lbCX}px)`;
    } else if(lbCY > 0){
      img.style.transform = `translateY(${lbCY}px) scale(${Math.max(0.7, 1 - lbCY/800)})`;
      img.style.opacity = String(Math.max(0.3, 1 - lbCY/500));
    }
  }, {passive:true});
  lb.addEventListener("touchend", () => {
    if(!lbActive) return;
    lbActive = false;
    const img = $("lightboxImg");
    img.style.transform = ""; img.style.opacity = "";
    const dx = lbCX, dy = lbCY;
    if(dy > 100 && Math.abs(dy) > Math.abs(dx)) closeLightbox();
    else if(dx < -60 && Math.abs(dx) > Math.abs(dy)){ if(lbIndex < lbImages.length - 1){ lbIndex++; updateLightbox(); } }
    else if(dx > 60 && Math.abs(dx) > Math.abs(dy)){ if(lbIndex > 0){ lbIndex--; updateLightbox(); } }
    lbCX = 0; lbCY = 0;
  }, {passive:true});
})();

$("lightbox").addEventListener("click", e => {
  if(e.target.id === "lightbox" || e.target.id === "lightboxImg"){
    if(Math.abs(lbCX) < 5 && Math.abs(lbCY) < 5) closeLightbox();
  }
});

/* ============ UPDATE META TAGS ============ */
function updateMeta(title, description, imageUrl){
  document.title = title + " — Musim Lab";
  $("ogTitle").setAttribute("content", title);
  $("ogDesc").setAttribute("content", description);
  $("twTitle").setAttribute("content", title);
  $("twDesc").setAttribute("content", description);
  $("ogUrl").setAttribute("content", window.location.href);
  if(imageUrl){
    $("ogImage").setAttribute("content", imageUrl);
    $("twImage").setAttribute("content", imageUrl);
  }
}

/* ============ RENDER: EVENT ============ */
function renderEvent(e){
  currentItem = e;
  currentType = "event";

  const cat = String(e["Category"] || "").trim();
  const info = getCatInfo(cat);
  const start = parseDate(e["Start Date"]);
  const end = parseDate(e["End Date"]);
  const link = String(e["Official Link"] || "").trim();
  const syn = String(e["Short Description"] || e["Description"] || "").trim();
  const fullDesc = String(e["Description"] || "").trim();
  const images = parseImages(e["Image URL"]);
  const isSaved = savedIds.includes(e["Event ID"]);
  const { dateMain, dateSub } = buildDateRange(start, end);
  const locLine = [e["Location"], e["Negeri"]].filter(Boolean).join(", ");

  updateMeta(
    e["Event Name"] || "Event",
    (syn || "").substring(0, 150),
    images[0] || ""
  );

  let html = `
    ${buildCarousel(images, info.icon)}
    <div class="content">
      <div class="cat-pill" style="background:${info.color}15;color:${info.color}">
        <span class="cat-dot" style="background:${info.color}"></span>
        ${info.icon} ${escapeHtml(cat || "Lain-lain")}
      </div>

      <div class="date-range-block">
        <div class="date-range-main">${dateMain}</div>
        <div class="date-range-sub">${dateSub}</div>
      </div>

      <h1 class="detail-title">${escapeHtml(e["Event Name"] || "Event")}</h1>
      ${locLine ? `<div class="detail-meta">📍 ${escapeHtml(locLine)}</div>` : ""}
      <div class="detail-synopsis">${escapeHtml(syn)}</div>

      <div class="detail-actions">
        <button class="action-btn ${isSaved ? "success" : "secondary"}" onclick="toggleSave('${e["Event ID"]}', this)">
          ${isSaved ? "✓ Disimpan" : "❤ Simpan"}
        </button>
        <button class="action-btn secondary" onclick="downloadICS()">🔔 Ingatkan</button>
        <button class="action-btn share full" onclick="shareItem()">📤 Kongsi Event Ini</button>
      </div>
  `;

  if(fullDesc && fullDesc !== syn){
    html += `<div class="detail-synopsis" style="border-top:1px solid #f0f0f0;padding-top:20px">${escapeHtml(fullDesc)}</div>`;
  }

  if(link){
    html += `<a href="${escapeHtml(link)}" target="_blank" rel="noopener" class="action-btn primary full" style="margin-bottom:10px">🔗 Official Website</a>`;
  }

  html += `<div id="prepContainer"></div>`;

  html += `
      <div class="footer-cta">
        <div class="footer-cta-title">Nak tengok event lain?</div>
        <div class="footer-cta-sub">Kalendar penuh Musim Lab</div>
        <a href="index.html" class="footer-cta-btn">📅 Buka Kalendar</a>
      </div>
    </div>
  `;

  $("main").innerHTML = html;
  attachCarouselScroll();
  loadPreparation("event", e["Event ID"], "prepContainer");
}

/* ============ RENDER: NEWS ============ */

  const sev = getSevInfo(n["Severity"]);

  const credit = n["Credit"];

  updateMeta(
    n["Title"] || "Berita",
    (n["Body"] || "").substring(0, 150),

  );

  let html = "";

  if(images.length){
    html += buildCarousel(images, sev.icon);
  } else {
    html += `<div style="padding:32px 16px;background:linear-gradient(135deg,${sev.color}15,${sev.color}05);display:flex;align-items:center;justify-content:center">
      <div style="font-size:80px;line-height:1">${sev.icon}</div>

        ${sev.icon} ${escapeHtml(n["Severity"] || "Info")}

    } else {

  html += `

  $("main").innerHTML = html;

  `;

/* ============ INIT ============ */
async function init(){
  const params = new URLSearchParams(window.location.search);
  const eventId = params.get("id");
  const seasonId = params.get("season");
  const newsId = params.get("news");

  if(!eventId && !seasonId && !newsId){
    renderError("Takde kandungan dipilih.");
    return;
  }

  try{
    // Load items dulu (untuk preparation)
    const itemsRes = await fetchAPI({ action: "getItems" });
    allItems = (itemsRes && itemsRes.success && Array.isArray(itemsRes.data)) ? itemsRes.data : [];

    // Event
    if(eventId){
      const res = await fetchAPI({ action: "getEvents" });
      const events = (res && res.success && Array.isArray(res.data)) ? res.data : [];
      const event = events.find(e => String(e["Event ID"]) === String(eventId));
      if(!event){ renderError("Event tak dijumpai."); return; }
      renderEvent(event);
      return;
    }

    // Season
    if(seasonId){
      const res = await fetchAPI({ action: "getSeasons" });
      const seasons = (res && res.success && Array.isArray(res.data)) ? res.data : [];
      const season = seasons.find(s => String(s["Season ID"]) === String(seasonId));
      if(!season){ renderError("Musim tak dijumpai."); return; }
      renderSeason(season);
      return;
    }

    // News
    if(newsId){
      const res = await fetchAPI({ action: "getNews" });
      const news = (res && res.success && Array.isArray(res.data)) ? res.data : [];
      const item = news.find(n => String(n["News ID"]) === String(newsId));
      if(!item){ renderError("Berita tak dijumpai."); return; }
      renderNews(item);
      return;
    }
  }catch(e){
    console.error(e);
    renderError("Gagal muat kandungan.");
  }
}

init();
