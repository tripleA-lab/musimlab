<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

  <title>Musim Lab</title>
  <meta name="description" content="Musim Lab - tahu apa yang akan datang, bersedia sebelum tiba.">

  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      padding: 0 0 95px 0;
      background: #f7f7f8;
      color: #171717;
      font-family: Arial, Helvetica, sans-serif;
    }

    button {
      font: inherit;
    }

    /* =========================
       HEADER
    ========================= */

    .top-header {
      background: #ffffff;
      padding: 18px 16px 14px;
      border-bottom: 1px solid #eeeeee;
      position: sticky;
      top: 0;
      z-index: 50;
    }

    .brand {
      font-size: 22px;
      font-weight: 800;
      letter-spacing: -0.5px;
    }

    .brand-sub {
      margin-top: 3px;
      font-size: 12px;
      color: #777;
    }

    /* =========================
       MAIN
    ========================= */

    main {
      max-width: 760px;
      margin: 0 auto;
      padding: 14px 12px 30px;
    }

    .calendar-title-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin: 8px 4px 12px;
    }

    .calendar-title {
      font-size: 18px;
      font-weight: 800;
    }

    .active-filter {
      font-size: 12px;
      color: #666;
      background: #eeeeee;
      padding: 5px 9px;
      border-radius: 999px;
      white-space: nowrap;
    }

    /* =========================
       CALENDAR CARD
    ========================= */

    .calendar-card {
      background: #ffffff;
      border-radius: 18px;
      overflow: hidden;
      border: 1px solid #ededed;
      box-shadow: 0 4px 20px rgba(0,0,0,0.04);
    }

    .month-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 14px;
      border-bottom: 1px solid #eeeeee;
    }

    .month-name {
      font-size: 20px;
      font-weight: 800;
    }

    .month-buttons {
      display: flex;
      gap: 6px;
    }

    .month-btn {
      width: 38px;
      height: 38px;
      border: 0;
      border-radius: 12px;
      background: #f1f1f2;
      cursor: pointer;
      font-size: 18px;
    }

    .month-btn:active {
      transform: scale(0.95);
    }

    .weekdays {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      border-bottom: 1px solid #eeeeee;
    }

    .weekday {
      text-align: center;
      padding: 10px 2px;
      font-size: 11px;
      font-weight: 700;
      color: #888;
    }

    .calendar-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
    }

    .day-cell {
      min-height: 72px;
      border-right: 1px solid #eeeeee;
      border-bottom: 1px solid #eeeeee;
      padding: 7px 5px;
      position: relative;
      background: #fff;
      cursor: pointer;
      overflow: hidden;
    }

    .day-cell:nth-child(7n) {
      border-right: 0;
    }

    .day-cell.empty {
      cursor: default;
      background: #fafafa;
    }

    .day-cell.today {
      background: #f7f4ff;
    }

    .day-number {
      font-size: 12px;
      font-weight: 700;
      color: #555;
      position: relative;
      z-index: 3;
    }

    .day-cell.today .day-number {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 24px;
      height: 24px;
      border-radius: 50%;
      background: #171717;
      color: #fff;
    }

    /* =========================
       HOLIDAY BACKGROUND
    ========================= */

    .holiday-label {
      position: absolute;
      left: 2px;
      right: 2px;
      bottom: 3px;
      font-size: 7px;
      line-height: 9px;
      color: #c7c7c7;
      text-align: center;
      text-transform: uppercase;
      pointer-events: none;
      font-weight: 700;
      letter-spacing: 0.2px;
    }

    /* =========================
       CATEGORY DOTS
    ========================= */

    .dots {
      position: relative;
      z-index: 4;
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
      margin-top: 7px;
      min-height: 8px;
    }

    .category-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      flex: 0 0 auto;
    }

    .dot-muzik {
      background: #3182ce;
    }

    .dot-sukan {
      background: #eab308;
    }

    .dot-budaya {
      background: #22a06b;
    }

    .dot-teknologi {
      background: #e5533d;
    }

    .dot-gaya {
      background: #f28c28;
    }

    .dot-local {
      background: #8b5e3c;
    }

    .dot-musim {
      background: #8b5cf6;
    }

    /* =========================
       EVENTS PANEL
    ========================= */

    .date-panel {
      margin-top: 14px;
    }

    .date-panel.hidden {
      display: none;
    }

    .date-panel-header {
      padding: 4px 4px 10px;
    }

    .date-panel-date {
      font-size: 15px;
      font-weight: 800;
    }

    .date-panel-sub {
      margin-top: 3px;
      font-size: 12px;
      color: #777;
    }

    .event-card {
      background: #fff;
      border: 1px solid #e9e9e9;
      border-radius: 16px;
      padding: 14px;
      margin-bottom: 9px;
      cursor: pointer;
      box-shadow: 0 3px 12px rgba(0,0,0,0.03);
    }

    .event-card:active {
      transform: scale(0.99);
    }

    .event-category {
      display: flex;
      align-items: center;
      gap: 7px;
      font-size: 11px;
      color: #777;
      margin-bottom: 7px;
    }

    .event-category .category-dot {
      width: 8px;
      height: 8px;
    }

    .event-name {
      font-size: 16px;
      font-weight: 800;
      line-height: 1.3;
    }

    .event-meta {
      margin-top: 7px;
      color: #666;
      font-size: 12px;
      line-height: 1.5;
    }

    .event-more {
      margin-top: 11px;
      font-size: 12px;
      font-weight: 700;
      color: #6d4aff;
    }

    /* =========================
       DETAIL PANEL
    ========================= */

    .detail-panel {
      margin-top: 14px;
      background: #fff;
      border-radius: 18px;
      border: 1px solid #e9e9e9;
      overflow: hidden;
    }

    .detail-panel.hidden {
      display: none;
    }

    .detail-image {
      width: 100%;
      max-height: 300px;
      object-fit: cover;
      display: block;
      background: #eee;
    }

    .detail-content {
      padding: 18px;
    }

    .back-button {
      border: 0;
      background: #f0f0f1;
      border-radius: 10px;
      padding: 8px 11px;
      font-size: 12px;
      font-weight: 700;
      margin-bottom: 14px;
      cursor: pointer;
    }

    .detail-category {
      display: flex;
      align-items: center;
      gap: 7px;
      font-size: 12px;
      color: #777;
      margin-bottom: 8px;
    }

    .detail-title {
      font-size: 24px;
      line-height: 1.2;
      font-weight: 800;
      margin: 0;
    }

    .detail-meta {
      margin-top: 12px;
      color: #666;
      font-size: 13px;
      line-height: 1.7;
    }

    .detail-description {
      margin-top: 18px;
      font-size: 14px;
      line-height: 1.7;
      color: #333;
      white-space: pre-line;
    }

    .official-link {
      display: inline-block;
      margin-top: 18px;
      text-decoration: none;
      background: #171717;
      color: #fff;
      padding: 11px 15px;
      border-radius: 11px;
      font-size: 13px;
      font-weight: 700;
    }

    /* =========================
       LOADING
    ========================= */

    .loading {
      text-align: center;
      padding: 35px 15px;
      color: #888;
      font-size: 13px;
    }

    /* =========================
       TOAST
    ========================= */

    .toast {
      position: fixed;
      left: 50%;
      bottom: 92px;
      transform: translate(-50%, 20px);
      background: #171717;
      color: #fff;
      padding: 11px 16px;
      border-radius: 12px;
      font-size: 12px;
      opacity: 0;
      pointer-events: none;
      transition: all 0.25s ease;
      z-index: 200;
      white-space: nowrap;
      max-width: calc(100vw - 30px);
      text-align: center;
    }

    .toast.show {
      opacity: 1;
      transform: translate(-50%, 0);
    }

    /* =========================
       BOTTOM SHEET
    ========================= */

    .sheet-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.35);
      z-index: 100;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease;
    }

    .sheet-overlay.open {
      opacity: 1;
      pointer-events: auto;
    }

    .bottom-sheet {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      background: #fff;
      border-radius: 22px 22px 0 0;
      z-index: 110;
      padding: 10px 16px calc(18px + env(safe-area-inset-bottom));
      transform: translateY(105%);
      transition: transform 0.28s ease;
      max-height: 82vh;
      overflow-y: auto;
    }

    .bottom-sheet.open {
      transform: translateY(0);
    }

    .sheet-handle {
      width: 42px;
      height: 4px;
      border-radius: 999px;
      background: #d6d6d6;
      margin: 2px auto 16px;
    }

    .sheet-title {
      font-size: 20px;
      font-weight: 800;
    }

    .sheet-subtitle {
      margin-top: 4px;
      color: #777;
      font-size: 12px;
      margin-bottom: 17px;
    }

    .explore-list {
      display: grid;
      gap: 8px;
    }

    .explore-option {
      width: 100%;
      display: flex;
      align-items: center;
      gap: 11px;
      border: 1px solid #ededed;
      background: #fafafa;
      border-radius: 14px;
      padding: 13px;
      text-align: left;
      cursor: pointer;
      font-weight: 700;
      font-size: 13px;
    }

    .explore-option:active {
      transform: scale(0.98);
    }

    .explore-option .category-dot {
      width: 10px;
      height: 10px;
    }

    .explore-option.all-option {
      justify-content: center;
      background: #171717;
      color: #fff;
      border-color: #171717;
    }

    /* =========================
       BOTTOM NAV
    ========================= */

    .bottom-nav {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 90;
      background: rgba(255,255,255,0.96);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-top: 1px solid #e9e9e9;
      padding: 7px 8px calc(7px + env(safe-area-inset-bottom));
    }

    .nav-inner {
      max-width: 760px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      align-items: end;
    }

    .nav-button {
      border: 0;
      background: transparent;
      padding: 5px 2px;
      cursor: pointer;
      color: #777;
      min-height: 54px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 3px;
    }

    .nav-icon {
      font-size: 19px;
      line-height: 20px;
    }

    .nav-label {
      font-size: 9px;
      font-weight: 700;
    }

    .nav-button.active {
      color: #171717;
    }

    .nav-button.musim-button {
      position: relative;
      margin-top: -18px;
    }

    .nav-button.musim-button .nav-icon {
      width: 50px;
      height: 50px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #8b5cf6;
      color: #fff;
      box-shadow: 0 7px 18px rgba(139,92,246,0.28);
      border: 4px solid #fff;
      font-size: 20px;
    }

    /* =========================
       DESKTOP
    ========================= */

    @media (min-width: 700px) {
      body {
        padding-bottom: 90px;
      }

      .top-header {
        padding-left: calc((100% - 760px) / 2 + 4px);
        padding-right: calc((100% - 760px) / 2 + 4px);
      }

      .bottom-nav {
        border-radius: 18px 18px 0 0;
      }

      .day-cell {
        min-height: 92px;
      }

      .bottom-sheet {
        left: 50%;
        right: auto;
        width: 520px;
        transform: translate(-50%, 105%);
      }

      .bottom-sheet.open {
        transform: translate(-50%, 0);
      }
    }
  </style>
</head>

<body>

  <!-- =========================
       HEADER
  ========================= -->

  <header class="top-header">
    <div class="brand">Musim Lab</div>
    <div class="brand-sub">Tahu musim. Tahu keperluan.</div>

  <!-- =========================
       MAIN
  ========================= -->

  <script>

    /* =====================================================
       MUSIM LAB
       CALENDAR V3 MOBILE
    ===================================================== */


    const API_URL =
      "https://script.google.com/macros/s/AKfycbxbweeVHYVhHf30JzVrmztnxcU6nFxZ62k7TYNTvLP7OiNq8i8cPetGZmXzQuOpcNE6/exec";


    const HOLIDAY_URL =
      "public-holidayMalaysia.json";


    let allEvents = [];

    let holidayData = [];

    let currentDate = new Date(2026, 8, 1);

    let selectedDate = null;

    let selectedEvent = null;

    let activeCategory = "ALL";


    const monthNames = [
      "Januari",
      "Februari",
      "Mac",
      "April",
      "Mei",
      "Jun",
      "Julai",
      "Ogos",
      "September",
      "Oktober",
      "November",
      "Disember"
    ];


    const categoryClassMap = {

      "Muzik & Konsert": "dot-muzik",

      "Sukan & Outdoor": "dot-sukan",

      "Budaya & Agama": "dot-budaya",

      "Teknologi & Perniagaan": "dot-teknologi",

      "Gaya Hidup": "dot-gaya",

      "Local": "dot-local",

      "Musim": "dot-musim"

    };


    /* =====================================================
       HELPERS
    ===================================================== */


    function normalise(value) {

      return String(value || "")
        .trim()
        .toLowerCase();

    }


    function getCategoryClass(category) {

      const clean =
        normalise(category);

      for (const key in categoryClassMap) {

        if (
          normalise(key) === clean
        ) {

          return categoryClassMap[key];

        }

      }

      return "dot-local";

    }


    function parseDate(value) {

      if (!value) return null;


      if (value instanceof Date) {

        return new Date(
          value.getFullYear(),
          value.getMonth(),
          value.getDate()
        );

      }


      const text =
        String(value).trim();


      /* DD/MM/YYYY */

      const slashMatch =
        text.match(
          /^(\d{1,2})\/(\d{1,2})\/(\d{4})/
        );


      if (slashMatch) {

        return new Date(
          Number(slashMatch[3]),
          Number(slashMatch[2]) - 1,
          Number(slashMatch[1])
        );

      }


      /* YYYY-MM-DD */

      const dateMatch =
        text.match(
          /^(\d{4})-(\d{1,2})-(\d{1,2})/
        );


      if (dateMatch) {

        return new Date(
          Number(dateMatch[1]),
          Number(dateMatch[2]) - 1,
          Number(dateMatch[3])
        );

      }


      /* ISO */

      const parsed =
        new Date(text);


      if (!isNaN(parsed.getTime())) {

        return new Date(
          parsed.getFullYear(),
          parsed.getMonth(),
          parsed.getDate()
        );

      }


      return null;

    }


    function dateKey(date) {

      return [
        date.getFullYear(),
        String(date.getMonth() + 1).padStart(2, "0"),
        String(date.getDate()).padStart(2, "0")
      ].join("-");

    }


    function sameDate(a, b) {

      if (!a || !b) return false;

      return (
        a.getFullYear() === b.getFullYear() &&
        a.getMonth() === b.getMonth() &&
        a.getDate() === b.getDate()
      );

    }


    function formatDate(date) {

      if (!date) return "";

      return (
        date.getDate() +
        " " +
        monthNames[date.getMonth()] +
        " " +
        date.getFullYear()
      );

    }


    function getEventStart(event) {

      return parseDate(
        event["Start Date"] ||
        event.startDate ||
        event.start
      );

    }


    function getEventEnd(event) {

      return parseDate(
        event["End Date"] ||
        event.endDate ||
        event.end
      );

    }


    function getEventCategory(event) {

      return String(
        event["Category"] ||
        event.category ||
        ""
      ).trim();

    }


    function getEventName(event) {

      return String(
        event["Event Name"] ||
        event.eventName ||
        event.name ||
        "Event"
      ).trim();

    }


    function getEventLocation(event) {

      return String(
        event["Location"] ||
        event.location ||
        ""
      ).trim();

    }


    function getEventDescription(event) {

      return String(
        event["Description"] ||
        event.description ||
        ""
      ).trim();

    }


    function getEventImage(event) {

      return String(
        event["Image URL"] ||
        event.imageUrl ||
        event.image ||
        ""
      ).trim();

    }


    function getEventLink(event) {

      return String(
        event["Official Link"] ||
        event.officialLink ||
        event.link ||
        ""
      ).trim();

    }


    function getEventId(event) {

      return String(
        event["Event ID"] ||
        event.eventId ||
        event.id ||
        ""
      ).trim();

    }


    function eventMatchesFilter(event) {

      if (activeCategory === "ALL") {

        return true;

      }

      return (
        normalise(
          getEventCategory(event)
        ) === normalise(activeCategory)
      );

    }


    /* =====================================================
       EVENTS FOR DATE
    ===================================================== */


    function getEventsForDate(date) {

      const target =
        new Date(
          date.getFullYear(),
          date.getMonth(),
          date.getDate()
        );


      return allEvents.filter(event => {

        if (!eventMatchesFilter(event)) {
          return false;
        }


        let start =
          getEventStart(event);

        let end =
          getEventEnd(event);


        if (!start) return false;

        if (!end) {
          end = start;
        }


        /* Kalau tarikh terbalik, swap */

        if (end < start) {

          const temp = start;

          start = end;

          end = temp;

        }


        const startOnly =
          new Date(
            start.getFullYear(),
            start.getMonth(),
            start.getDate()
          );


        const endOnly =
          new Date(
            end.getFullYear(),
            end.getMonth(),
            end.getDate()
          );


        return (
          target >= startOnly &&
          target <= endOnly
        );

      });

    }


    /* =====================================================
       CATEGORY DOTS FOR DATE
    ===================================================== */


    function getCategoriesForDate(date) {

      const events =
        allEvents.filter(event => {

          if (!eventMatchesFilter(event)) {
            return false;
          }


          let start =
            getEventStart(event);

          let end =
            getEventEnd(event);


          if (!start) return false;

          if (!end) end = start;


          if (end < start) {

            const temp = start;

            start = end;

            end = temp;

          }


          const targetKey =
            dateKey(date);


          const startKey =
            dateKey(start);

          const endKey =
            dateKey(end);


          return (
            targetKey >= startKey &&
            targetKey <= endKey
          );

        });


      const categories = [];


      events.forEach(event => {

        const category =
          getEventCategory(event);


        if (!category) return;


        const already =
          categories.some(
            item =>
              normalise(item) ===
              normalise(category)
          );


        if (!already) {

          categories.push(category);

        }

      });


      return categories;

    }


    /* =====================================================
       HOLIDAY
    ===================================================== */


    function getHolidayForDate(date) {

      if (!Array.isArray(holidayData)) {
        return [];
      }


      const target =
        dateKey(date);


      return holidayData.filter(item => {

        if (!item) return false;


        const start =
          parseDate(item.start);

        const end =
          parseDate(item.end || item.start);


        if (!start) return false;


        const finalEnd =
          end || start;


        return (
          target >= dateKey(start) &&
          target <= dateKey(finalEnd)
        );

      });

    }


    /* =====================================================
       RENDER CALENDAR
    ===================================================== */


    function renderCalendar() {

      const grid =
        document.getElementById(
          "calendarGrid"
        );


      grid.innerHTML = "";


      const year =
        currentDate.getFullYear();


      const month =
        currentDate.getMonth();


      document.getElementById(
        "monthName"
      ).textContent =
        monthNames[month] +
        " " +
        year;


      const firstDay =
        new Date(
          year,
          month,
          1
        );


      /*
        JS Sunday = 0
        Kita nak Monday = 0
      */

      const startOffset =
        (firstDay.getDay() + 6) % 7;


      const daysInMonth =
        new Date(
          year,
          month + 1,
          0
        ).getDate();


      for (
        let i = 0;
        i < startOffset;
        i++
      ) {

        const blank =
          document.createElement(
            "div"
          );

        blank.className =
          "day-cell empty";

        grid.appendChild(blank);

      }


      const today =
        new Date();


      for (
        let day = 1;
        day <= daysInMonth;
        day++
      ) {

        const date =
          new Date(
            year,
            month,
            day
          );


        const cell =
          document.createElement(
            "div"
          );

        cell.className =
          "day-cell";


        if (
          sameDate(
            date,
            today
          )
        ) {

          cell.classList.add(
            "today"
          );

        }


        const number =
          document.createElement(
            "div"
          );

        number.className =
          "day-number";

        number.textContent =
          day;


        cell.appendChild(
          number
        );


        /*
          Holiday layer
        */

        const holidays =
          getHolidayForDate(date);


        if (
          holidays.length > 0
        ) {

          const holidayNames =
            holidays.map(
              item =>
                item.name ||
                "Cuti"
            );


          const holidayLabel =
            document.createElement(
              "div"
            );

          holidayLabel.className =
            "holiday-label";

          holidayLabel.textContent =
            holidayNames.join(" • ");


          cell.appendChild(
            holidayLabel
          );

        }


        /*
          Category dots
        */

        const categories =
          getCategoriesForDate(
            date
          );


        const dots =
          document.createElement(
            "div"
          );

        dots.className =
          "dots";


        categories.forEach(
          category => {

            const dot =
              document.createElement(
                "span"
              );

            dot.className =
              "category-dot " +
              getCategoryClass(
                category
              );


            dot.title =
              category;


            dots.appendChild(
              dot
            );

          }
        );


        cell.appendChild(
          dots
        );


        cell.addEventListener(
          "click",
          () => {

            selectDate(date);

          }
        );


        grid.appendChild(
          cell
        );

      }


      updateCalendarTitle();

    }


    /* =====================================================
       TITLE / FILTER
    ===================================================== */


    function updateCalendarTitle() {

      const title =
        document.getElementById(
          "calendarTitle"
        );

      const label =
        document.getElementById(
          "filterLabel"
        );


      if (
        activeCategory === "ALL"
      ) {

        title.textContent =
          "Calendar";

        label.textContent =
          "Semua";

      } else {

        title.textContent =
          activeCategory;

        label.textContent =
          "Filter aktif";

      }

    }


    /* =====================================================
       SELECT DATE
    ===================================================== */


    function selectDate(date) {

      selectedDate =
        new Date(date);


      selectedEvent = null;


      hideDetail();


      const events =
        getEventsForDate(date);


      const panel =
        document.getElementById(
          "datePanel"
        );


      const dateTitle =
        document.getElementById(
          "datePanelDate"
        );


      const dateSub =
        document.getElementById(
          "datePanelSub"
        );


      const container =
        document.getElementById(
          "dateEvents"
        );


      if (
        events.length === 0
      ) {

        panel.classList.add(
          "hidden"
        );


        const holidays =
          getHolidayForDate(
            date
          );


        if (
          holidays.length > 0
        ) {

          showToast(
            holidays
              .map(
                item =>
                  item.name ||
                  "Tarikh penting"
              )
              .join(" • ")
          );

        } else {

          showToast(
            "Tiada event untuk setakat ini."
          );

        }


        return;

      }


      panel.classList.remove(
        "hidden"
      );


      dateTitle.textContent =
        formatDate(date);


      dateSub.textContent =
        events.length +
        (
          events.length === 1
            ? " event"
            : " events"
        );


      container.innerHTML = "";


      events.forEach(
        event => {

          const card =
            document.createElement(
              "div"
            );

          card.className =
            "event-card";


          const category =
            getEventCategory(event);


          const categoryRow =
            document.createElement(
              "div"
            );

          categoryRow.className =
            "event-category";


          const dot =
            document.createElement(
              "span"
            );

          dot.className =
            "category-dot " +
            getCategoryClass(
              category
            );


          const categoryText =
            document.createElement(
              "span"
            );

          categoryText.textContent =
            category ||
            "Local";


          categoryRow.appendChild(
            dot
          );

          categoryRow.appendChild(
            categoryText
          );


          const title =
            document.createElement(
              "div"
            );

          title.className =
            "event-name";

          title.textContent =
            getEventName(event);


          const meta =
            document.createElement(
              "div"
            );

          meta.className =
            "event-meta";


          const start =
            getEventStart(event);

          const end =
            getEventEnd(event);


          let dateText = "";


          if (start) {

            dateText =
              formatDate(start);

          }


          if (
            end &&
            start &&
            !sameDate(
              start,
              end
            )
          ) {

            dateText +=
              " → " +
              formatDate(end);

          }


          const location =
            getEventLocation(event);


          if (dateText) {

            meta.textContent =
              dateText;

          }


          if (location) {

            if (meta.textContent) {

              meta.textContent +=
                " • ";

            }

            meta.textContent +=
              location;

          }


          const more =
            document.createElement(
              "div"
            );

          more.className =
            "event-more";

          more.textContent =
            "See more detail →";


          card.appendChild(
            categoryRow
          );

          card.appendChild(
            title
          );

          card.appendChild(
            meta
          );

          card.appendChild(
            more
          );


          card.addEventListener(
            "click",
            () => {

              showEventDetail(
                event
              );

            }
          );


          container.appendChild(
            card
          );

        }
      );


      /*
        Mobile: scroll sikit ke panel
      */

      setTimeout(() => {

        panel.scrollIntoView({
          behavior: "smooth",
          block: "start"
        });

      }, 80);

    }


    /* =====================================================
       EVENT DETAIL
    ===================================================== */


    function showEventDetail(event) {

      selectedEvent =
        event;


      const datePanel =
        document.getElementById(
          "datePanel"
        );


      const detailPanel =
        document.getElementById(
          "detailPanel"
        );


      datePanel.classList.add(
        "hidden"
      );


      detailPanel.classList.remove(
        "hidden"
      );


      const category =
        getEventCategory(event);


      const categoryContainer =
        document.getElementById(
          "detailCategory"
        );


      categoryContainer.innerHTML = "";


      const dot =
        document.createElement(
          "span"
        );

      dot.className =
        "category-dot " +
        getCategoryClass(
          category
        );


      const categoryText =
        document.createElement(
          "span"
        );

      categoryText.textContent =
        category ||
        "Local";


      categoryContainer.appendChild(
        dot
      );

      categoryContainer.appendChild(
        categoryText
      );


      document.getElementById(
        "detailTitle"
      ).textContent =
        getEventName(event);


      const start =
        getEventStart(event);

      const end =
        getEventEnd(event);


      let metaText = "";


      if (start) {

        metaText =
          formatDate(start);

      }


      if (
        end &&
        start &&
        !sameDate(
          start,
          end
        )
      ) {

        metaText +=
          " → " +
          formatDate(end);

      }


      const location =
        getEventLocation(event);


      if (location) {

        if (metaText) {

          metaText +=
            " • ";

        }

        metaText +=
          location;

      }


      document.getElementById(
        "detailMeta"
      ).textContent =
        metaText;


      document.getElementById(
        "detailDescription"
      ).textContent =
        getEventDescription(event);


      /*
        Image
      */

      const imageContainer =
        document.getElementById(
          "detailImageContainer"
        );


      imageContainer.innerHTML = "";


      const imageUrl =
        getEventImage(event);


      if (imageUrl) {

        const image =
          document.createElement(
            "img"
          );

        image.className =
          "detail-image";

        image.src =
          imageUrl;

        image.alt =
          getEventName(event);


        image.onerror =
          () => {

            image.remove();

          };


        imageContainer.appendChild(
          image
        );

      }


      /*
        Official link
      */

      const linkContainer =
        document.getElementById(
          "detailLink"
        );


      linkContainer.innerHTML = "";


      const officialLink =
        getEventLink(event);


      if (officialLink) {

        const link =
          document.createElement(
            "a"
          );

        link.className =
          "official-link";

        link.href =
          officialLink;

        link.target =
          "_blank";

        link.rel =
          "noopener noreferrer";

        link.textContent =
          "Official Link →";


        linkContainer.appendChild(
          link
        );

      }


      setTimeout(() => {

        detailPanel.scrollIntoView({
          behavior: "smooth",
          block: "start"
        });

      }, 80);

    }


    function hideDetail() {

      document.getElementById(
        "detailPanel"
      ).classList.add(
        "hidden"
      );

    }


    /* =====================================================
       FILTER
    ===================================================== */


    function setCategory(category) {

      activeCategory =
        category;


      selectedDate =
        null;


      selectedEvent =
        null;


      document.getElementById(
        "datePanel"
      ).classList.add(
        "hidden"
      );


      document.getElementById(
        "detailPanel"
      ).classList.add(
        "hidden"
      );


      renderCalendar();


      window.scrollTo({
        top: 0,
        behavior: "smooth"
      });

    }


    /* =====================================================
       EXPLORE SHEET
    ===================================================== */


    function openExplore() {

      document.getElementById(
        "sheetOverlay"
      ).classList.add(
        "open"
      );


      document.getElementById(
        "exploreSheet"
      ).classList.add(
        "open"
      );

    }


    function closeExplore() {

      document.getElementById(
        "sheetOverlay"
      ).classList.remove(
        "open"
      );


      document.getElementById(
        "exploreSheet"
      ).classList.remove(
        "open"
      );

    }


    document
      .getElementById(
        "sheetOverlay"
      )
      .addEventListener(
        "click",
        closeExplore
      );


    document
      .querySelectorAll(
        ".explore-option"
      )
      .forEach(
        button => {

          button.addEventListener(
            "click",
            () => {

              const category =
                button.dataset.category;


              if (
                category === "ALL"
              ) {

                setCategory(
                  "ALL"
                );

              } else {

                setCategory(
                  category
                );

              }


              closeExplore();

            }
          );

        }
      );


    /* =====================================================
       TOAST
    ===================================================== */


    let toastTimer = null;


    function showToast(message) {

      const toast =
        document.getElementById(
          "toast"
        );


      toast.textContent =
        message;


      toast.classList.add(
        "show"
      );


      clearTimeout(
        toastTimer
      );


      toastTimer =
        setTimeout(
          () => {

            toast.classList.remove(
              "show"
            );

          },
          2600
        );

    }


    /* =====================================================
       BOTTOM NAV
    ===================================================== */


    document
      .getElementById(
        "navHome"
      )
      .addEventListener(
        "click",
        () => {

          setCategory(
            "ALL"
          );

          window.scrollTo({
            top: 0,
            behavior: "smooth"
          });

        }
      );


    document
      .getElementById(
        "navExplore"
      )
      .addEventListener(
        "click",
        openExplore
      );


    document
      .getElementById(
        "navMusim"
      )
      .addEventListener(
        "click",
        () => {

          setCategory(
            "Musim"
          );

          showToast(
            "Paparan Musim"
          );

        }
      );


    document
      .getElementById(
        "navCheck"
      )
      .addEventListener(
        "click",
        () => {

          showToast(
            "Musim Lab Check belum dibuka lagi."
          );

        }
      );


    document
      .getElementById(
        "navMore"
      )
      .addEventListener(
        "click",
        () => {

          showToast(
            "Menu tambahan akan datang."
          );

        }
      );


    document
      .getElementById(
        "prevMonth"
      )
      .addEventListener(
        "click",
        () => {

          currentDate =
            new Date(
              currentDate.getFullYear(),
              currentDate.getMonth() - 1,
              1
            );


          renderCalendar();

        }
      );


    document
      .getElementById(
        "nextMonth"
      )
      .addEventListener(
        "click",
        () => {

          currentDate =
            new Date(
              currentDate.getFullYear(),
              currentDate.getMonth() + 1,
              1
            );


          renderCalendar();

        }
      );


    document
      .getElementById(
        "backToDate"
      )
      .addEventListener(
        "click",
        () => {

          hideDetail();


          if (selectedDate) {

            document
              .getElementById(
                "datePanel"
              )
              .classList.remove(
                "hidden"
              );

          }

        }
      );


    /* =====================================================
       LOAD EVENTS FROM GOOGLE APPS SCRIPT
    ===================================================== */


    async function loadEvents() {

      try {

        const response =
          await fetch(
            API_URL +
            "?t=" +
            Date.now()
          );


        if (!response.ok) {

          throw new Error(
            "API response error"
          );

        }


        const data =
          await response.json();


        if (
          Array.isArray(data)
        ) {

          allEvents =
            data;

        } else {

          allEvents =
            [];

        }


        renderCalendar();


      } catch (error) {

        console.error(
          "Load events error:",
          error
        );


        allEvents =
          [];


        renderCalendar();


        showToast(
          "Tak dapat baca data event."
        );

      }

    }


    /* =====================================================
       LOAD PUBLIC HOLIDAY JSON
       OPTIONAL
       Kalau file belum ada, website
       tetap jalan macam biasa.
    ===================================================== */


    async function loadHolidays() {

      try {

        const response =
          await fetch(
            HOLIDAY_URL +
            "?t=" +
            Date.now()
          );


        if (!response.ok) {

          return;

        }


        const data =
          await response.json();


        /*
          Support:

          {
            "holidays": [...]
          }

          atau terus:

          [...]
        */

        if (
          Array.isArray(data)
        ) {

          holidayData =
            data;

        } else if (
          Array.isArray(
            data.holidays
          )
        ) {

          holidayData =
            data.holidays;

        } else {

          holidayData =
            [];

        }


        renderCalendar();


      } catch (error) {

        /*
          File belum wujud pun tak apa.
          Calendar masih boleh jalan.
        */

        holidayData =
          [];

      }

    }


    /* =====================================================
       START
    ===================================================== */


    loadEvents();

    loadHolidays();

  </script>
