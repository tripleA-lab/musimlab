<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Musim Lab</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f7f7f5;color:#222}
.container{width:min(1100px,94%);margin:auto}header{padding:28px 0 18px}
.brand{font-size:30px;font-weight:800;margin:0}.tagline{margin:6px 0;color:#666;font-size:14px}
.hero,.calendar-card,.events-panel{background:#fff;border:1px solid #e7e7e7;border-radius:18px}
.hero{padding:24px;margin:10px 0 22px}.hero h1{margin:0 0 7px;font-size:clamp(25px,5vw,40px)}.hero p{margin:0;color:#666}
.section-title{margin:24px 0 12px;font-size:20px}
.explore{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.explore-btn{border:1px solid #ddd;background:#fff;border-radius:14px;padding:13px 12px;cursor:pointer;text-align:left;font-size:14px}
.explore-btn.active{border:2px solid #222;padding:12px 11px;box-shadow:0 3px 12px #0000000f}
.explore-label{display:flex;align-items:center;gap:9px;font-weight:700}
.dot{width:11px;height:11px;border-radius:50%;display:inline-block;flex:0 0 11px}
.dot-muzik{background:#3182ce}.dot-sukan{background:#eab308}.dot-budaya{background:#22a06b}.dot-teknologi{background:#e5533d}.dot-gaya{background:#f28c28}.dot-local{background:#8b5e3c}.dot-musim{background:#8b5cf6}
.calendar-card{padding:18px;overflow:hidden}.calendar-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.month-title{font-size:21px;font-weight:800;text-transform:capitalize}.calendar-nav{display:flex;gap:7px}
.nav-btn{border:1px solid #ddd;background:#fff;border-radius:10px;width:38px;height:38px;cursor:pointer;font-size:18px}
.filter-status{min-height:25px;margin-bottom:8px;color:#555;font-size:14px;font-weight:700}
.calendar{display:grid;grid-template-columns:repeat(7,1fr);border-top:1px solid #eee;border-left:1px solid #eee}
.weekday{padding:10px 4px;text-align:center;font-size:12px;font-weight:700;color:#777;border-right:1px solid #eee;border-bottom:1px solid #eee}
.day{min-height:88px;position:relative;padding:8px 6px;background:#fff;border-right:1px solid #eee;border-bottom:1px solid #eee;cursor:pointer;overflow:hidden}
.day.empty{cursor:default;background:#fbfbfb}.day:hover{background:#fafafa}.day-number{position:relative;z-index:2;font-size:13px;font-weight:700}
.dots{position:relative;z-index:2;display:flex;flex-wrap:wrap;gap:5px;margin-top:9px}
.day.cuti{background:#fafafa}.cuti-label{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#d0d0d0;font-size:9px;font-weight:800;letter-spacing:.5px;transform:rotate(-18deg);pointer-events:none}
.events-panel{margin-top:18px;padding:18px;display:none}.events-panel.show{display:block}.events-panel h2{margin:0 0 14px;font-size:20px}
.event-card{border:1px solid #e5e5e5;border-radius:14px;padding:15px;margin-bottom:10px;cursor:pointer}.event-category{display:flex;align-items:center;gap:7px;color:#666;font-size:12px;margin-bottom:6px}.event-title{font-size:16px;font-weight:800;margin-bottom:5px}.event-meta{font-size:13px;color:#666}
.loading{text-align:center;padding:30px 10px;color:#777}footer{padding:35px 0;color:#888;font-size:12px;text-align:center}
@media(max-width:800px){.explore{grid-template-columns:repeat(2,1fr)}.day{min-height:72px}}
@media(max-width:520px){.container{width:96%}.hero{padding:19px}.calendar-card{padding:10px}.day{min-height:67px;padding:6px 4px}.weekday{padding:8px 2px;font-size:10px}.dots{gap:4px;margin-top:7px}.dot{width:8px;height:8px;flex-basis:8px}.cuti-label{font-size:7px}}
</style>
</head>
<body>
<div class="container">
<header><h1 class="brand">Musim Lab</h1><p class="tagline">Tahu Musim, Tahu Keperluan.</p></header>

<section class="hero"><h1>Apa yang akan datang?</h1><p>Check apa yang sedang berlaku, apa yang bakal tiba dan apa yang patut kau sediakan.</p></section>

<h2 class="section-title">Explore</h2>
<section class="explore">
<button class="explore-btn" data-category="Muzik & Konsert"><span class="explore-label"><span class="dot dot-muzik"></span>Muzik & Konsert</span></button>
<button class="explore-btn" data-category="Sukan & Outdoor"><span class="explore-label"><span class="dot dot-sukan"></span>Sukan & Outdoor</span></button>
<button class="explore-btn" data-category="Budaya & Agama"><span class="explore-label"><span class="dot dot-budaya"></span>Budaya & Agama</span></button>
<button class="explore-btn" data-category="Teknologi & Perniagaan"><span class="explore-label"><span class="dot dot-teknologi"></span>Teknologi & Perniagaan</span></button>
<button class="explore-btn" data-category="Gaya Hidup"><span class="explore-label"><span class="dot dot-gaya"></span>Gaya Hidup</span></button>
<button class="explore-btn" data-category="Local"><span class="explore-label"><span class="dot dot-local"></span>Local</span></button>
<button class="explore-btn" data-category="Musim"><span class="explore-label"><span class="dot dot-musim"></span>Musim</span></button>
<button class="explore-btn" data-category="ALL"><span class="explore-label">Lihat Semua</span></button>
</section>

<h2 class="section-title">Calendar</h2>
<section class="calendar-card">
<div class="calendar-top"><div class="month-title" id="monthTitle"></div><div class="calendar-nav"><button class="nav-btn" id="prev">‹</button><button class="nav-btn" id="next">›</button></div></div>
<div class="filter-status" id="filterStatus"></div>
<div id="calendar" class="calendar"><div class="loading">Sedang baca musim...</div></div>
</section>
<section id="eventsPanel" class="events-panel"></section>
<footer>Musim Lab © 2026</footer>
</div>

<script>
const API_URL='https://script.google.com/macros/s/AKfycbxbweeVHYVhHf30JzVrmztnxcU6nFxZ62k7TYNTvLP7OiNq8i8cPetGZmXzQuOpcNE6/exec';
let allEvents=[],selectedCategory=null,currentMonth=8,currentYear=2026;
let publicData={holidays:[]};
const dots={"muzik & konsert":"dot-muzik","sukan & outdoor":"dot-sukan","budaya & agama":"dot-budaya","teknologi & perniagaan":"dot-teknologi","gaya hidup":"dot-gaya","local":"dot-local","musim":"dot-musim"};

document.addEventListener("DOMContentLoaded",()=>{loadEvents();loadPublicHoliday();});
document.querySelectorAll(".explore-btn").forEach(b=>b.addEventListener("click",()=>setFilter(b.dataset.category==="ALL"?null:b.dataset.category)));
document.getElementById("prev").onclick=()=>changeMonth(-1);
document.getElementById("next").onclick=()=>changeMonth(1);

async function loadEvents(){
 try{let r=await fetch(API_URL);let d=await r.json();allEvents=Array.isArray(d)?d:[];renderCalendar();}
 catch(e){console.error(e);document.getElementById("calendar").innerHTML='<div class="loading">Tak dapat baca data event sekarang.</div>';}
}
async function loadPublicHoliday(){
 try{let r=await fetch("public-holidayMalaysia.json",{cache:"no-store"});if(!r.ok)throw Error();publicData=await r.json();renderCalendar();}
 catch(e){console.log("public-holidayMalaysia.json belum ada. Calendar event tetap berjalan.");}
}
function setFilter(c){selectedCategory=c;document.querySelectorAll(".explore-btn").forEach(b=>b.classList.toggle("active",(c===null&&b.dataset.category==="ALL")||b.dataset.category===c));document.getElementById("eventsPanel").classList.remove("show");renderCalendar();}
function changeMonth(n){currentMonth+=n;if(currentMonth>11){currentMonth=0;currentYear++}if(currentMonth<0){currentMonth=11;currentYear--}renderCalendar();}
function renderCalendar(){
 const cal=document.getElementById("calendar"),title=document.getElementById("monthTitle"),status=document.getElementById("filterStatus");
 title.textContent=new Date(currentYear,currentMonth,1).toLocaleDateString("ms-MY",{month:"long",year:"numeric"});
 status.textContent=selectedCategory?"Menunjukkan: "+selectedCategory:"";
 cal.innerHTML="";
 ["Isn","Sel","Rab","Kha","Jum","Sab","Aha"].forEach(x=>{let e=document.createElement("div");e.className="weekday";e.textContent=x;cal.appendChild(e);});
 let first=new Date(currentYear,currentMonth,1).getDay();first=first===0?6:first-1;
 for(let i=0;i<first;i++){let e=document.createElement("div");e.className="day empty";cal.appendChild(e);}
 let total=new Date(currentYear,currentMonth+1,0).getDate();
 for(let d=1;d<=total;d++){
  let cell=document.createElement("div");cell.className="day",key=dateKey(currentYear,currentMonth,d);
  cell.innerHTML='<div class="day-number">'+d+'</div>';
  let h=holiday(key);if(h){cell.classList.add("cuti");let x=document.createElement("div");x.className="cuti-label";x.textContent=h.name||"CUTI";cell.appendChild(x);}
  let ev=getEvents(key),cats=[...new Set(ev.map(e=>String(e.E||e.Category||"").trim()).filter(Boolean))];
  let dotsEl=document.createElement("div");dotsEl.className="dots";
  cats.forEach(c=>{if(dots[c.toLowerCase()]){let x=document.createElement("span");x.className="dot "+dots[c.toLowerCase()];x.title=c;dotsEl.appendChild(x);}});
  cell.appendChild(dotsEl);
  if(ev.length||h)cell.onclick=()=>showDate(key);
  cal.appendChild(cell);
 }
}
function getEvents(key){return allEvents.filter(e=>{
 let c=String(e.E||e.Category||"").trim();if(selectedCategory&&c.toLowerCase()!==selectedCategory.toLowerCase())return false;
 let s=parseDate(e.C||e["Start Date"]||e.StartDate),en=parseDate(e.D||e["End Date"]||e.EndDate),t=parseDate(key);if(!s)return false;if(!en)en=s;if(en<s)[s,en]=[en,s];return t>=s&&t<=en;
})}
function showDate(key){
 let p=document.getElementById("eventsPanel"),ev=getEvents(key),h=holiday(key);p.innerHTML="<h2>"+readable(key)+"</h2>";
 if(h)p.innerHTML+='<div class="event-card" style="cursor:default"><div class="event-category">Calendar Malaysia</div><div class="event-title">'+esc(h.name||"Cuti")+'</div></div>';
 if(!ev.length&&!h)p.innerHTML+="<p>Tak ada event untuk tarikh ni.</p>";
 ev.forEach(e=>{
  let c=String(e.E||e.Category||"").trim(),name=String(e.B||e["Event Name"]||e.eventName||"Event"),loc=String(e.F||e.Location||"").trim(),id=String(e.A||e["Event ID"]||"").trim();
  let card=document.createElement("div");card.className="event-card";card.innerHTML='<div class="event-category"><span class="dot '+(dots[c.toLowerCase()]||"")+'"></span>'+esc(c||"Lain-lain")+'</div><div class="event-title">'+esc(name)+'</div><div class="event-meta">'+esc(loc||"Lokasi belum dinyatakan")+'</div><div class="event-meta" style="margin-top:7px">See more detail →</div>';
  card.onclick=()=>{if(id)location.href="event.html?id="+encodeURIComponent(id)};p.appendChild(card);
 });
 p.classList.add("show");p.scrollIntoView({behavior:"smooth",block:"start"});
}
function holiday(key){let a=Array.isArray(publicData.holidays)?publicData.holidays:[],t=parseDate(key);return a.find(h=>{let s=parseDate(h.start),e=parseDate(h.end||h.start);return s&&e&&t>=s&&t<=(e<s?s:e)})||null;}
function dateKey(y,m,d){return y+"-"+String(m+1).padStart(2,"0")+"-"+String(d).padStart(2,"0")}
function parseDate(v){if(!v)return null;let s=String(v).trim(),m=s.match(/^(\d{4})-(\d{2})-(\d{2})/);if(m)return new Date(+m[1],+m[2]-1,+m[3]);m=s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})/);if(m)return new Date(+m[3],+m[2]-1,+m[1]);let d=new Date(s);return isNaN(d)?null:new Date(d.getFullYear(),d.getMonth(),d.getDate());}
function readable(k){return parseDate(k).toLocaleDateString("ms-MY",{weekday:"long",day:"numeric",month:"long",year:"numeric"})}
function esc(v){return String(v).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#039;")}
</script>
</body></html>
